<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Runtime Observability Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <h1>Runtime Observability Dashboard</h1>
        <p>Telemetry-first monitoring for multi-agent workflows.</p>
      </div>
      <div class="status-legend" id="statusLegend"></div>
    </header>

    <main class="layout">
      <aside class="panel">
        <div class="panel-header">
          <h2>Workflows</h2>
          <label for="statusFilter" class="filter-label">Status</label>
          <select id="statusFilter">
            <option value="all">All</option>
          </select>
        </div>
        <ul id="workflowList" class="workflow-list"></ul>
      </aside>

      <section class="panel panel-wide">
        <div class="panel-header">
          <h2>Execution Timeline</h2>
          <span id="timelineMeta" class="subtle"></span>
        </div>
        <div id="timeline" class="timeline"></div>

        <div class="split-grid">
          <div>
            <div class="panel-header inline">
              <h3>Structured Runtime Logs</h3>
            </div>
            <div id="logViewer" class="log-viewer"></div>
          </div>
          <div>
            <div class="panel-header inline">
              <h3>Agent Handoff Trace</h3>
            </div>
            <div id="handoffTrace" class="handoff-trace"></div>
          </div>
        </div>
      </section>
    </main>

    <div id="workflowDrawer" class="drawer" aria-hidden="true">
      <div class="drawer-content">
        <button id="drawerClose" class="close-btn" aria-label="Close">×</button>
        <h2 id="drawerTitle"></h2>
        <div id="drawerBody" class="drawer-body"></div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
